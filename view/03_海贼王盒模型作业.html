<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .item{
            width: 400px;
            height: 400px;
            border: 10px solid #fd5df5;
            padding: 20px;
            /* box-sizing: border-box; */

            margin: 100px auto 0px;
        }

            width: 400px;

        }

            margin-top: 25px;
            font-size: 23px;
            line-height: 23px;
        }
        .item .text span{
            color: red;
        }
    </style>
</head>
<body>
    <div class="item">
        <img src="../img/haizewang.webp" alt="">
        <div class="text">
            &nbsp;&nbsp;<span>《航海王》</span>（ONE PIECE）又称《海贼 王》，是日本漫画家尾田荣一郎创作的 少年漫画作品，于1997年07月22日在 集英社《周刊少年Jump》开始连载。
        </div>
    </div>
</body>
</html>
