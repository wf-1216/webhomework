<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #eee;
        }
        .box{
            width: 234px;
            height: 300px;
            background-color: #fff;
            margin: 100px auto;
            text-align: center;
        }
        .box .bg{
            height: 200px;
        }
        .box .bg img{
            width: 160px;
            height: 160px;
            padding: 20px 0px;
        }
        .box h3{
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 3px;
        }
        .box .info{
            font-size: 12px;
            color: #b5b5b5;
            margin-bottom: 15px;
        }
        .box .price{
            font-size: 12px;
            color: orange;
        }
        .box .del{
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="bg">
            <img src="../img/mi.webp" alt="">
        </div>
        <h3>redmi turbo 4 pro</h3>
        <p class="info">turbo 4 pro好看,更能打!</p>
        <p><span class="price">1999元起</span> <span class="info del">2199元</span></p>
    </div>
</body>
</html>
