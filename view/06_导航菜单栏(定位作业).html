<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul,li{
            list-style: none;
        }
        .wrap{
            min-width: 1200px;
            max-width: 1700px;
            height: 300px;
            background-color: #441b79;
            position: relative;
            top: 150px;
            margin: 0 auto;
        }
        .wrap .item{
            width: 220px;
            height: 476px;
            background-color: #188eee;
            position: relative;
            top: -50px;
            left: 120px;
            color: #fff;
        }
        .wrap .title{
            height: 50px;
            font-size: 18px;
            line-height: 50px;
            font-weight: 500;
            padding-left: 15px;
        }
        .wrap .title .bg{
            display: inline-block;
            width: 27px;
            height: 27px;
            background: url("../img/三杠.png") no-repeat center / cover;
            vertical-align: -7px;
            margin-right: 10px;
        }
        .wrap .list-content{
            height: 426px;
            background-color:  #0477c0;
            position: relative;
        }
        .wrap .list-content li{
            height: 70px;
            padding: 0px 15px;
            border-bottom: 1px solid #1681c4;
            font-weight: 500;
        }
        .wrap .list-content li h3{
            font-size: 15px;
            height: 42px;
            line-height: 42px;
        }
        .wrap .list-content li .symbol{
            color: #92cbe9;
            float: right;
        }
        .wrap .list-content li p{
            font-size: 13px;
            color: #92cbe9;
        }
        .wrap .list-content .show{
            display: none;
            width: 984px;
            height: 426px;
            border: 2px solid blue;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 220px;
        }
        .wrap .list-content li:hover .show{
            display: block;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="item">
            <h3 class="title">
                <span class="bg"></span>
                <span>全部课程</span>
            </h3>
            <ul class="list-content">
                <li>
                    <h3>IT·互联网 <span class="symbol">&gt;</span></h3>
                    <p>前端开发Linux运维</p>
                    <div class="show" style="background-color: red;">
                        IT·互联网
                    </div>
                </li>
                <li>
                    <h3>设计·创作 <span class="symbol">&gt;</span></h3>
                    <p>平面设计游戏美术设计CAD</p>
                    <div class="show" style="background-color: green;">
                        设计·创作
                    </div>
                </li>
                <li>
                    <h3>语言·留学 <span class="symbol">&gt;</span></h3>
                    <p>实用口语雅思托福</p>
                    <div class="show" style="background-color: yellow;">
                        语言·留学
                    </div>
                </li>
                <li>
                    <h3>职业考证 <span class="symbol">&gt;</span></h3>
                    <p>公务员教师考试建造工程</p>
                    <div class="show" style="background-color: aqua;">
                        职业考证
                    </div>
                </li>
                <li>
                    <h3>升学·考研 <span class="symbol">&gt;</span></h3>
                    <p>考研大学高中初中</p>
                    <div class="show" style="background-color: rgb(211, 28, 196);">
                        升学·考研
                    </div>
                </li>
                <li>
                    <h3>兴趣·生活 <span class="symbol">&gt;</span></h3>
                    <p>摄影乐器美妆育儿</p>
                    <div class="show" style="background-color: rgb(17, 67, 203);">
                        兴趣·生活
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
