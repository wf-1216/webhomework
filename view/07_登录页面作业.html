<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;padding: 0;}
        body{
            background-color: #a6d9ee;
        }
        input{
            outline: none;
        }
        .wrap{
            width: 400px;
            height: 335px;
            background-color: #fff;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            /* 通过定位以及外边距设置来操作元素居中 */
            margin: auto;
            border-radius: 5px;
            text-align: center;
        }
        .wrap h2{
            font-size: 22px;
            height: 100px;
            line-height: 100px;
            font-weight: 400;
            user-select: none;
        }
        .wrap input{
            width: 370px;
            height: 44px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .wrap .pwd{
            margin: 18px 0px;
        }
        .wrap button{
            width: 370px;
            height: 44px;
            border-radius: 5px;
            background-color: #2980b9;
            border: 0px solid transparent;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }
        .wrap button:hover{
            background-color: aqua;
        }
        .wrap .info{
            font-size: 12px;
            margin-top: 35px;
            user-select: none;
        }
        .wrap .info span{
            color: #2980b9;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h2>登录界面</h2>
        <div>
            <input type="text" placeholder="用户名">
        </div>
        <div class="pwd">
            <input type="text" placeholder="密码">
        </div>
        <div>
            <button>确定</button>
        </div>
        <p class="info">还没有账号吗?<span>注册</span></p>
    </div>
</body>
</html>
