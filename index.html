<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端学习作业</title>
    <link rel="stylesheet" href="./css/reset.css">
    <style>
        body {
            width: 100vh;
            height: 100vh;
            background: url('./img/钢铁侠.jpg') no-repeat center center/cover;
            background-attachment: fixed;
            padding: 30px;
        }

        /* 科幻主卡片 */
        .iron-card {
            width: 240px;
            height: 500px;
            position: relative;
            background: linear-gradient(135deg, rgba(10, 18, 30, 0.75), rgba(22, 35, 55, 0.65));
            border: 1px solid rgba(0, 180, 255, 0.35);
            border-radius: 14px;
            padding: 32px;
            box-shadow:
                0 0 25px rgba(0, 140, 255, 0.25),
                inset 0 0 60px rgba(0, 120, 200, 0.08);
            color: #ffffff;
        }

        .left {
            position: fixed;
            left: 100px;
            top: 50%;
            transform: translateY(-50%);
        }

        .right {
            position: fixed;
            right: 100px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* 卡片边角机甲光效 */
        .borderlt {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            border-top: 2px solid #00a8ff;
            border-left: 2px solid #00a8ff;
            border-radius: 14px 0 0 0;
        }

        .borderrb {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 80px;
            height: 80px;
            border-bottom: 2px solid #ff3333;
            border-right: 2px solid #ff3333;
            border-radius: 0 0 14px 0;
        }

        /* 分类标题栏 */
        .tech-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .hc {
            border-left: 4px solid #ff3636;
            background: linear-gradient(90deg, rgba(255, 60, 60, 0.22), transparent);
            text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
        }

        /* JS标题区分红金色（钢铁侠主配色） */
        .js {
            border-left: 4px solid #00a8ff;
            background: linear-gradient(90deg, rgba(0, 168, 255, 0.22), transparent);
            text-shadow: 0 0 10px rgba(0, 170, 255, 0.6);
        }

        /* 列表条目 */
        ul li {
            color: #d8eaff;
            font-size: 17px;
            line-height: 3;
            padding: 5px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 2px solid transparent;
        }

        /* 悬浮机甲发光效果 */
        ul li:hover {
            background: rgba(0, 168, 255, 0.16);
            border-left: 2px solid #00a8ff;
            transform: translateX(8px);
            box-shadow: 0 0 12px rgba(0, 170, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="iron-card left">
        <div class="borderlt"></div>
        <div class="borderrb"></div>
        <div class="tech-title hc">HTML & CSS</div>
        <ul>
            <li>1. 基础标签作业</li>
            <li>2. 样式+选择器作业</li>
            <li>3. 海贼王盒模型作业</li>
            <li>4. 海贼王盒模型进阶作业</li>
            <li>5. 小米手机练习</li>
            <li>6. 导航菜单栏(定位作业)</li>
            <li>7. 登录页面作业</li>
        </ul>
    </div>
    <div class="iron-card right">
        <div class="borderlt"></div>
        <div class="borderrb"></div>
        <div class="tech-title js">JavaScript</div>
        <ul>
            <li>8. 基础DOM背景</li>
            <li>9. 评论信息(输入框)</li>
            <li>10. 人物移动</li>
            <li>11. 购物车作业</li>
            <li>12. 验证规则</li>
            <li>13. 选项卡</li>
        </ul>
    </div>
    <script>
        let liEl = document.querySelectorAll("li")
        let liArr = [
            "./view/01_基础标签作业.html",
            "./view/02_样式+选择器作业.html",
            "./view/03_海贼王盒模型作业.html",
            "./view/04_海贼王盒模型进阶作业.html",
            "./view/05_小米手机练习.html",
            "./view/06_导航菜单栏(定位作业).html",
            "./view/07_登录页面作业.html",
            "./view/08_基础DOM背景.html",
            "./view/09_评论信息(输入框).html",
            "./view/10_人物移动.html",
            "./view/11_购物车作业.html",
            "./view/12_验证规则.html",
            "./view/13_选项卡.html",
        ]
        console.log(liEl);
        liEl.forEach((item, index) => {
            item.onclick = () => {
                location.href = liArr[index]
            }
        })
    </script>
</body>

</html>
